name: CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      env:
        FSB_SKIP_HEAVY_ML: "1"
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ".[dev]"
        # Prefer prebuilt TA-Lib wheels; never block CI on source builds
        pip install "TA-Lib>=0.6.7" --only-binary=:all: || echo "TA-Lib binary wheel unavailable; continuing without it"
        
    - name: Lint with ruff
      continue-on-error: true
      run: |
        ruff check forexsmartbot/ tests/ || true
        
    - name: Type check with mypy
      continue-on-error: true
      run: |
        mypy forexsmartbot/ --ignore-missing-imports || true
        
    - name: Format check with black
      continue-on-error: true
      run: |
        black --check forexsmartbot/ tests/ || true
        
    - name: Test with pytest
      env:
        FSB_SKIP_HEAVY_ML: "1"
      run: |
        pytest tests/ --cov=forexsmartbot --cov-report=xml --cov-report=term-missing -v
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build package
      run: |
        python -m build
        
    - name: Check package
      run: |
        twine check dist/*
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/*
        retention-days: 7

  native-wheels:
    name: Build fsb_core wheels
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install maturin
      run: |
        python -m pip install --upgrade pip
        pip install maturin

    - name: Build fsb_core wheel
      working-directory: native/fsb_core
      run: maturin build --release --out dist

    - name: Upload fsb_core wheel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fsb-core-wheels
        path: native/fsb_core/dist/*
        retention-days: 14
