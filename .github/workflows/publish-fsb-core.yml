name: Publish fsb-core to PyPI

# Builds manylinux wheels + sdist for the optional native extension and
# publishes on tags matching fsb-core-v*.*.* (or manual dispatch).
# Requires a PyPI Trusted Publisher for project fsb-core → workflow publish-fsb-core.yml
# (or PYPI_API_TOKEN secret). First release (0.4.0) was uploaded via token+twine.

on:
  push:
    tags:
      - 'fsb-core-v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: wheel (${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: native/fsb_core
          command: build
          args: --release --out dist -i python${{ matrix.python }}
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: fsb-core-wheel-cp${{ matrix.python }}
          path: native/fsb_core/dist/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: native/fsb_core
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: fsb-core-sdist
          path: native/fsb_core/dist/*.tar.gz

  publish:
    needs: [build, sdist]
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/fsb-core-v')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
