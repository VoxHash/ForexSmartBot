[package]
name = "fsb_core"
version = "0.6.0"
edition = "2021"
description = "Native indicator and backtest helpers for ForexSmartBot (PyO3)"
license = "MIT"
authors = ["VoxHash <contact@voxhash.dev>"]

[lib]
name = "fsb_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }
rayon = "1.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
